name: Build TVBox SMB Spider Jar

on:
  workflow_dispatch: # 允许网页端手动点击运行
  push:
    branches:
      - main 

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出仓库代码
      uses: actions/checkout@v4

    - name: 2. 优雅过滤：剔除不需要的爬虫文件
      run: |
        # 1. 进入爬虫源码存放目录
        cd app/src/main/java/com/github/catvod/spider
        
        # 2. 除了关键的 Samba.java 之外，把其余所有不需要的 Java 源码删掉
        # 这样官方的 build.sh 打包出来的就是我们想要的精简版
        find . -type f ! -name 'Samba.java' -delete
        echo "=== 过滤完成，当前源码目录留存文件 ==="
        ls -la

    - name: 3. 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 4. 赋予脚本执行权限
      run: |
        chmod +x gradlew
        chmod +x build.sh

    - name: 5. 触发编译并严格跳过单元测试
      # -x test 和 -x lint 用于强行跳过因删除了源码而导致的单元测试报错
      run: ./gradlew :app:assembleRelease -x test -x lint

    - name: 6. 转换并生成最终 DEX-Jar 产物
      run: |
        BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
        echo "使用 Android 编译工具链路径: $BUILD_TOOLS_DIR"
        
        # 自动捕获新版 Gradle 编译输出的核心 classes.jar
        ORIGIN_JAR=$(find app/build/intermediates/ -name "classes.jar" | head -n 1)
        
        if [ -z "$ORIGIN_JAR" ]; then
          echo "❌ 错误：未在构建目录中找到生成的核心 class 文件"
          exit 1
        fi
        
        # 使用 d8 工具将编译出的纯 Java 字节码包转为 Android 电视专用的 DEX-Jar 包
        $BUILD_TOOLS_DIR/d8 --output ./tvbox_smb_spider.jar $ORIGIN_JAR
        echo "✅ DEX 格式转换成功！生成最终产物：tvbox_smb_spider.jar"

    - name: 7. 上传编译产物到 GitHub 供下载
      uses: actions/upload-artifact@v4
      with:
        name: TVBox-SMB-Spider-Release
        path: ./tvbox_smb_spider.jar
