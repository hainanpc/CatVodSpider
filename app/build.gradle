plugins {
    alias(libs.plugins.android.application)
}

def robolectricJvmArgs = [
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.security=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
        '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
]

android {
    namespace = 'com.github.catvod'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId = "com.github.catvod.demo"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            jvmArgs += robolectricJvmArgs
            outputs.upToDateWhen { false }
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            force "com.squareup.okhttp3:okhttp:${libs.versions.okhttp.get()}"
        }
    }
}

dependencies {
    implementation 'org.codelibs:jcifs:2.1.34'
    compileOnly libs.androidx.annotation
    implementation libs.okhttp
    implementation libs.sardine.android
    implementation libs.quickjs.wrapper
    implementation libs.gson
    implementation libs.smbj
    implementation libs.jsoup
    testImplementation libs.junit
    testImplementation libs.robolectric
}

tasks.register('siteTest') {
    group = 'verification'
    dependsOn 'testDebugUnitTest'
}
// 注册专属的精简打包任务，只打包 Samba 相关内容
tasks.register('makeJar', Jar) {
    group = 'build'
    description = 'Only compile and pack Samba spider, exclude all others.'
    
    archiveClassifier = ''
    archiveBaseName = 'spider'
    destinationDirectory = file("${project.layout.buildDirectory.get().asFile}")

    // 1. 编译后的 classes 根路径
    def classesDir = "${project.layout.buildDirectory.get().asFile}/intermediates/javac/release/compileReleaseJavaWithJavac/classes"

    // 2. 严格的包含和排除规则（核心隔离点）
    from(classesDir) {
        // 必须保留的底层系统框架和核心工具类
        include 'com/github/catvod/crawler/**'
        include 'com/github/catvod/pojo/**'
        include 'com/github/catvod/utils/**'
        include 'com/github/catvod/net/**'
        
        // 核心拦截：只放行 Samba.class，其余所有 Alist、Ali、Bili、Baidu 等全部丢弃不打包
        include 'com/github/catvod/spider/Samba.class'
        include 'com/github/catvod/spider/Samba$*.class' // 包含可能存在的内部匿名类
    }

    // 3. 将第三方依赖库（如 smbj, jcifs 及其依赖的 asn1 等）打进胖包
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        // 排除第三方依赖包中无用的证书和说明文件，最大化压榨包体积
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/LICENSE*'
    }

    // 4. 让此任务必须在官方编译任务完成后执行
    dependsOn 'compileReleaseJavaWithJavac'
}
