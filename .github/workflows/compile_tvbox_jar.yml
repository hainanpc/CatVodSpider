name: Build TVBox SMB Spider Jar

on:
  workflow_dispatch: # 允许网页端手动点击运行
  push:
    branches:
      - main 

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出仓库代码
      uses: actions/checkout@v4

    - name: 2. 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. 赋予 Gradle 脚本执行权限
      run: chmod +x gradlew

    - name: 4. 全局预编译与专属精简打包
      # 先整体触发一次 release 编译生成 classes 文件，紧接着提取打包 Samba
      run: |
        ./gradlew :app:assembleRelease
        ./gradlew :app:makeJar

    - name: 5. 转换并生成最终 DEX-Jar 产物
      run: |
        BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
        echo "使用 Android 编译工具链路径: $BUILD_TOOLS_DIR"
        
        ORIGIN_JAR="app/build/spider.jar"
        
        if [ ! -f "$ORIGIN_JAR" ]; then
          echo "❌ 错误：未在 app/build/ 中找到生成的 spider.jar，请检查编译日志！"
          exit 1
        fi
        
        $BUILD_TOOLS_DIR/d8 --output ./tvbox_smb_spider.jar $ORIGIN_JAR
        echo "✅ DEX 格式转换成功！生成最终产物：tvbox_smb_spider.jar"

    - name: 6. 上传编译产物到 GitHub 供下载
      uses: actions/upload-artifact@v4
      with:
        name: TVBox-SMB-Spider-Release
        path: ./tvbox_smb_spider.jar
