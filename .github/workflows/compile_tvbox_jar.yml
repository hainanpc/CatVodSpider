name: Build TVBox SMB Spider Jar
on: [workflow_dispatch, push]
jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build and Package
      run: |
        # 1. 过滤源码仅保留Samba并编译APK
        find app/src/main/java/com/github/catvod/spider -type f ! -name 'Samba.java' -delete
        ./gradlew :app:assembleRelease
        # 2. 物理裁剪APK生成Jar
        APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        unzip -q $APK_PATH -d temp_apk
        cd temp_apk && zip -r ../tvbox_smb_spider.jar .
    - uses: actions/upload-artifact@v4
      with:
        name: TVBox-SMB-Spider-Release
        path: ./tvbox_smb_spider.jar
